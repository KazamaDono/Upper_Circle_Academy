name: Build and publish toolbox images

on:
  push:
    branches: [ main ]
    paths:
      - "cybersecurity-and-it/pentesting/Dockerfile"
      - "cybersecurity-and-it/pentesting/.dockerignore"
      - "cybersecurity-and-it/exploit-development/lab/Dockerfile"
      - "cybersecurity-and-it/exploit-development/.dockerignore"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - course: pentesting
            image: uca-pentesting-toolbox
            context: ./cybersecurity-and-it/pentesting
            dockerfile: ./cybersecurity-and-it/pentesting/Dockerfile
          - course: exploit-development
            image: uca-exploit-development-toolbox
            context: ./cybersecurity-and-it/exploit-development
            dockerfile: ./cybersecurity-and-it/exploit-development/lab/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.course }}
          cache-to: type=gha,mode=max,scope=${{ matrix.course }}
